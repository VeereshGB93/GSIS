name: KPTCL Daily Maintenance Automation

on:
  schedule:
    - cron: '30 3 * * *'   # 9:00 AM IST daily (UTC time)
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run KPTCL automation
        env:
          KPTCL_USERNAME: ${{ secrets.KPTCL_USERNAME }}
          KPTCL_PASSWORD: ${{ secrets.KPTCL_PASSWORD }}
        run: python kptcl_automation_server.py

      - name: Upload logs on any run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kptcl-logs
          path: logs/
